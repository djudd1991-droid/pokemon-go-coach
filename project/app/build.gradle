plugins { id 'com.android.application' }
android {
 namespace 'com.david.gocoach'
 compileSdk 35
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'com.david.gocoach'; minSdk 30; targetSdk 35; versionCode 29; versionName '0.9.21' }
 signingConfigs { debug { storeFile file('../test-signing.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1'; implementation 'org.opencv:opencv:4.12.0' }
