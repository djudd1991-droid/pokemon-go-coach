name: Build GO Coach APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'project/**'
      - 'tools/**'
      - 'go-coach-source.zip'
      - 'go-coach-portraits.zip'
      - 'go-coach-wild-map.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify source package matches readable source
        run: |
          python tools/package.py --check
      - name: Run logic regression checks
        run: |
          mkdir -p .checks
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar --output .checks/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  .checks/json.jar' | sha256sum --check
          python tools/check.py --json-jar .checks/json.jar
      - name: Add optional Pokemon portraits
        run: |
          if [ -f go-coach-portraits.zip ]; then
            mkdir -p project/app/src/main/assets/portraits
            unzip -q -o go-coach-portraits.zip -d project/app/src/main/assets/portraits
          fi
      - name: Add optional wild map tuning
        run: |
          if [ -f go-coach-wild-map.zip ]; then
            unzip -q -o go-coach-wild-map.zip -d project/app/src/main/assets
          fi
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Report lint findings
        if: always()
        run: |
          if [ -f project/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat project/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GO-Coach-v0.9.21-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ui-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GO-Coach-v0.9.21-APK
          path: .checks/apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and capture native UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python tools/ui_smoke.py .checks/apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GO-Coach-UI-check
          path: .checks/ui
          if-no-files-found: warn
          retention-days: 14
