name: Build GO Coach APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'go-coach-source.zip'
      - 'go-coach-portraits.zip'
      - 'go-coach-wild-map.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack source
        run: unzip -q go-coach-source.zip -d project
      - name: Add optional Pokemon portraits
        run: |
          if [ -f go-coach-portraits.zip ]; then
            mkdir -p project/app/src/main/assets/portraits
            unzip -q -o go-coach-portraits.zip -d project/app/src/main/assets/portraits
          fi
      - name: Add optional wild map tuning
        run: |
          if [ -f go-coach-wild-map.zip ]; then
            unzip -q -o go-coach-wild-map.zip -d project/app/src/main/assets
          fi
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GO-Coach-v0.9.14-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
